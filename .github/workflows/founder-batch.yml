name: Founder emails (queue today's 60)
# Queues today's founder emails from the template Shlok approved in chat on 2026-11-19
# (config/templates/founder-v1.toml), already approved. No model. The sender sends them inside its caps.
# Two slots because GitHub schedules run late or get dropped (issue I0005); the second run only tops up.
on:
  schedule:
    - cron: '30 3 * * *'   # 09:00 IST
    - cron: '45 5 * * *'   # 11:15 IST, top-up if the first was dropped
  workflow_dispatch:
    inputs:
      count:
        description: 'How many for today (default: routing.toml per_day)'
        required: false
permissions:
  contents: write
concurrency:
  group: founder-batch
  cancel-in-progress: false
jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Queue today's founder template emails (approved in chat 2026-11-19; the sender sends them)
        run: python -m outreach campaign queue --template founder-v1 ${{ inputs.count && format('--limit {0}', inputs.count) || '' }}
