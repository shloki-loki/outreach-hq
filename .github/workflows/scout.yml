name: Lead scout (job boards)

# Reads every free job source and stores what passes the rules. Four times a day (IST 07:10, 12:10,
# 17:10, 22:10). Naukri, Wellfound and Hiring Cafe (Apify) run inside this job when APIFY_TOKEN is set and
# they are due. Research, people and drafting run in research.yml.
on:
  schedule:
    - cron: "40 1,6,11,16 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Sources, comma-separated (blank = all)"
        required: false

permissions:
  contents: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      # read-only: LinkedIn job-alert emails in his inbox (outreach/sources/alerts.py)
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scout
        run: |
          if [ -n "${{ inputs.only }}" ]; then python -m outreach scout --only "${{ inputs.only }}"; else python -m outreach scout; fi
