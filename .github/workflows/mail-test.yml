name: Mail test

# Sends one test email to your own address from GitHub's servers, to prove the stored Gmail
# secrets work where the real sender runs. Started by hand only.
on:
  workflow_dispatch:

jobs:
  mail-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m outreach mail-test
