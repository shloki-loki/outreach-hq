# Operating rules for the send, track and follow-up agents.

# live: an email Shlok approved on the website is sent. dry_run: approved emails are held and nothing is sent.
# Switched to live on 2026-11-12 at Shlok's instruction, after the test email worked locally and from GitHub.
mode = "live"

timezone = "Asia/Kolkata"

[sending]
new_emails_per_day = 70       # first-touch cold emails: 60 founder template (speculative cap) + 10 for jobs
followups_per_day = 70       # generic follow-up template for job and founder emails (2026-11-19)
max_per_run = 10              # one sender run never sends more than this (Mac runs every 20 min while awake)
gap_seconds_min = 60          # human-like pause between two sends
gap_seconds_max = 120
window_start = "08:00"        # emails only go out inside this window (IST), daily
window_end = "21:00"
send_days = ["mon", "tue", "wed", "thu", "fri", "sat", "sun"]
unverified_per_day = 2        # verified addresses are the rule; at most this many unverified ones go out per day
speculative_per_day = 60      # included in the daily first-email cap
one_email_per_person_days = 60  # never cold-email the same address twice inside this many days
max_contacts_per_company = 2    # people at one company who get a cold email for the same lead
attach_resume = false         # links land in inboxes more reliably than attachments

[followups]
max_followups = 1              # Shlok, 2026-11-27: one follow-up only; a second one annoys people and gets marked spam
first_after_business_days = 2   # Shlok, 2026-11-24: 2 working days of no reply
second_after_business_days = 2  # unused while max_followups = 1
stop_on = ["replied", "bounced", "lead_closed", "unsubscribed"]

[tracking]
inbox_lookback_days = 45

[digest]
send_to = "111shlokagrawal@gmail.com"
hour_ist = 8

[signature]
text = """Shlok Agrawal
IIT Guwahati | ex-Ola Electric (Strategy & Operations)
Portfolio: https://shlokagrawal-portfolio.vercel.app"""

# Free tiers only. `limit` is what the code will spend per period; keep it under the provider's
# real free allowance (check the provider's pricing page when you add the key).
[providers.hunter]
env = "HUNTER_API_KEY"
period = "month"
limit = 45

[providers.quickemailverification]
env = "QEV_API_KEY"
period = "day"
limit = 90

[providers.reoon]
env = "REOON_API_KEY"
period = "day"
limit = 18

# More free verifiers, used side by side (whichever has the most free quota left goes first). Each is used
# only when its key is set. Limits sit just under each free plan (checked 2026-11-19 from comparison sites;
# confirm on the vendor's page when signing up). One-time allowances use a long period so they are not
# re-counted each month.
[providers.mailboxvalidator]
env = "MAILBOXVALIDATOR_API_KEY"
period = "month"
limit = 290

[providers.verifalia]
env = "VERIFALIA_CREDENTIALS"      # "username:password" of a Verifalia user
period = "day"
limit = 24

[providers.zerobounce]
env = "ZEROBOUNCE_API_KEY"
period = "month"
limit = 95

[providers.emailable]
env = "EMAILABLE_API_KEY"
period = "month"
limit = 240                        # one-time 250 at signup; remove the key once it says the credit is used

[providers.debounce]
env = "DEBOUNCE_API_KEY"
period = "month"
limit = 95                         # one-time 100

[providers.apollo]
env = "APOLLO_API_KEY"
period = "month"
limit = 60

# Apify (Naukri, Wellfound, Hiring Cafe, LinkedIn people). Apify's free plan gives $5 of credit a month and
# Claude's own lead-scout runs (LinkedIn posts) use the same account, so the GitHub jobs stop at this figure.
# Checked against Apify's real usage for the month before every call.
[apify]
env = "APIFY_TOKEN"
monthly_cap_usd = 3.5

# The free model the GitHub research and writing jobs use (outreach/llm.py). Both are Google's free tier.
# Model names are matched against what the key can use; the first available one is taken.
[llm]
seconds_between_calls = 7
# Free tier (checked 2026-11-15 with llm-check): 20 requests a day PER MODEL for the Flash models, so ~80 good
# calls a day across the chain; enough for about 20-25 leads. paid = true turns on Google billing-side use with
# a hard daily cap counted from each reply's token usage (prices below, from the pricing page 2026-11-15).
paid = false
daily_cap_usd = 3.0
prices_usd_per_million = { default = [0.75, 3.75], "gemini-3.8-flash" = [0.75, 3.75], "gemini-3.7-flash" = [0.75, 3.75], "gemini-3.6-flash" = [0.75, 3.75], "gemini-3.5-flash-lite" = [0.30, 2.50], "gemini-3.1-flash-lite" = [0.25, 1.50] }
research_models = ["gemini-2.5-flash", "gemini-3.8-flash"]  # grounded search: 2.5 is free but gone for new keys; 3.x grounds on the paid tier only  # only 2.5 has free Google Search grounding; if the key
                                                               # cannot use either, evidence is fetched (website + Google News)
reader_models = ["gemini-3.5-flash-lite", "gemini-3.1-flash-lite"]  # reads fetched pages into evidence (own quota)
writer_models = ["gemini-3.8-flash", "gemini-3.7-flash", "gemini-3.6-flash", "gemini-3.5-flash"]   # each list is a fallback chain:
judge_models = ["gemini-3.8-flash", "gemini-3.7-flash", "gemini-3.6-flash", "gemini-3.5-flash", "gemini-3.5-flash-lite"]  # a model out of
# free quota for the day is skipped and the next one is used (outreach/llm.py generate)

[providers.gemini]
env = "GEMINI_API_KEY"
period = "day"
limit = 220             # calls a day across research and writing; under the free daily limit

[providers.gemini_search]
env = "GEMINI_API_KEY"
period = "day"
limit = 150             # grounded (Google Search) calls a day; free up to 500
