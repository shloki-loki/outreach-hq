name: Research and write (free model)

# The work that used to need Claude on the Mac, now on GitHub with Google's free Gemini tier:
#   1. research unresearched leads (outreach/research.py), best first
#   2. find people on LinkedIn for qualified leads (outreach/people.py, Apify, capped)
#   3. find and verify their email addresses (outreach/emailfinder.py)
#   4. draft cold emails, follow-ups and LinkedIn notes for Shlok's approval (outreach/writer.py)
# Each step stops cleanly when its key is missing or its free quota for the day is used.
# Nothing here sends anything: drafts wait for approval on the site.
on:
  schedule:
    - cron: "30 0,4,8,12,16 * * *"   # 06:00, 10:00, 14:00, 18:00, 22:00 IST (volume: 100 applications a day)
  workflow_dispatch:
    inputs:
      research_limit:
        description: "Leads to research this run"
        required: false
        default: "40"
      compare_ids:
        description: "Quality check only: comma-separated lead ids Claude already researched. Prints both verdicts, stores nothing, skips every other step."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      REOON_API_KEY: ${{ secrets.REOON_API_KEY }}
      HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare with Claude's research (stores nothing)
        if: inputs.compare_ids != ''
        shell: bash   # bash -eo pipefail, so a failure is not hidden by tee
        run: python -m outreach research-run --compare "${{ inputs.compare_ids }}" | tee compare.json
      - name: Keep the comparison
        if: inputs.compare_ids != ''
        uses: actions/upload-artifact@v4
        with:
          name: compare
          path: compare.json
      - name: Research leads
        if: ${{ !inputs.compare_ids }}
        run: python -m outreach research-run --limit "${{ inputs.research_limit || '40' }}"
      - name: Find people on LinkedIn
        if: ${{ always() && !inputs.compare_ids }}
        run: python -m outreach people-run --limit 6
      - name: Find email addresses for new people
        if: ${{ always() && !inputs.compare_ids }}
        run: |
          for id in $(python -c "from outreach import store; print(' '.join([l['id'] for l in store.load('leads')['leads'] if l.get('stage') == 'qualified' and l.get('open') is not False and any(c.get('name') and not c.get('email') for c in l.get('contacts', []))][:6]))"); do
            python -m outreach find-email --lead "$id" || echo "find-email failed for $id"
          done
      - name: Draft emails, follow-ups and LinkedIn notes
        if: ${{ always() && !inputs.compare_ids }}
        run: python -m outreach write-run
